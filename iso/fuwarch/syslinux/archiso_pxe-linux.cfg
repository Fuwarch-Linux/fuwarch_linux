LABEL arch_nbd
TEXT HELP
Boot the Fuwarch Linux install medium using NBD.
It allows you to install Fuwarch Linux or perform system maintenance.
ENDTEXT
MENU LABEL Fuwarch Linux install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

