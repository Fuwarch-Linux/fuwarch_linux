# Fuwarch Linux — live ISO pacman.conf (build time)
# Multilib habilitado: o ISO espelha o comportamento do sistema instalado.

[options]
Architecture = auto
HoldPkg = pacman glibc

[core]
Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[extra]
Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[multilib]
Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
