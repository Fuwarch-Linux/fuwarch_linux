# Fuwarch Linux — live ISO pacman.conf (build time)
# Espelhos diretos apenas (sem Include do mirrorlist do host)

[options]
Architecture = auto
HoldPkg = pacman glibc
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://mirrors.edge.kernel.org/archlinux/core/os/x86_64
Server = https://archlinux.c3sl.pr.gov.br/archlinux/core/os/x86_64
Server = https://mirrors.kernel.org/archlinux/core/os/x86_64
Server = https://mirror.rackspace.com/archlinux/core/os/x86_64

[extra]
Server = https://mirrors.edge.kernel.org/archlinux/extra/os/x86_64
Server = https://archlinux.c3sl.pr.gov.br/archlinux/extra/os/x86_64
Server = https://mirrors.kernel.org/archlinux/extra/os/x86_64
Server = https://mirror.rackspace.com/archlinux/extra/os/x86_64

[multilib]
Server = https://mirrors.edge.kernel.org/archlinux/multilib/os/x86_64
Server = https://archlinux.c3sl.pr.gov.br/archlinux/multilib/os/x86_64
Server = https://mirrors.kernel.org/archlinux/multilib/os/x86_64
Server = https://mirror.rackspace.com/archlinux/multilib/os/x86_64

[nyarch-repo]
SigLevel = PackageOptional DatabaseOptional
Server = https://de-pkgmirror.nyarchlinux.moe/$arch/
Server = https://mousecorp.xyz/pub/linux/nyarch/packages/$arch/